<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Afterglow · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; margin-top: 12px; }
    .btn { border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
    .btn.primary { background: var(--amber); color: var(--night); border-color: var(--amber); font-weight: 600; }
    .btn.danger { border-color: #e74c3c; color: #ff8a7a; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 6px; }
    .tabs .btn.on { background: #fff; color: var(--night); }
    .item { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 12px; margin-top: 10px; }
    .item .meta { font-size: 12px; color: #7a5e52; margin: 6px 0 10px; }
    .item .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .item .actions .btn { color: var(--ink); border-color: rgba(0,0,0,0.2); padding: 6px 12px; font-size: 13px; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eee; margin-left: 6px; }
    .badge.pending { background: #ffe08a; } .badge.hidden { background: #ddd; } .badge.rep { background: #ffb4a8; }
    code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
    label { display: flex; align-items: center; gap: 10px; }
    input[type=text] { background: var(--paper); border: none; border-radius: 8px; padding: 8px 10px; font-size: 15px; }
  </style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">Afterglow · Admin</div><button class="btn" id="out" hidden>Sign out</button></header>
  <div id="app"><p class="loading">Loading…</p></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { firebaseConfig, DEFAULT_BAR, SDK } from "./js/firebase-config.js";
import { W, H, renderAll, MOODS } from "./js/painting.js";
import { DEFAULT_TARGET, roundKey, finishRound, regenerate } from "./js/rounds.js";
const { initializeApp } = await import(`${SDK}/firebase-app.js`);
const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } = await import(`${SDK}/firebase-auth.js`);
const fsmod = await import(`${SDK}/firebase-firestore.js`);
const { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, getDocs, serverTimestamp } = fsmod;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const barId = (new URLSearchParams(location.search).get("bar") || DEFAULT_BAR).toLowerCase();
let notes = [], filter = "attention", unsub = null, bar = {};

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); }

function signInView() {
  $("#app").innerHTML = `<div class="card"><p>Sign in with Google to moderate notes.</p>
    <button class="btn primary" id="g">Sign in with Google</button></div>`;
  $("#g").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => toast(e.message));
}

function notAdminView(u) {
  $("#app").innerHTML = `<div class="card">
    <p><b>Almost there.</b> This account isn't an admin yet.</p>
    <p>In Firebase Console → Firestore → create collection <code>admins</code>, and add a document whose <b>Document ID</b> is:</p>
    <p><code id="uid">${esc(u.uid)}</code> <button class="btn" id="cp">Copy</button></p>
    <p>Add any field (e.g. <code>name</code> = your name), save, then reload this page.</p></div>`;
  $("#cp").onclick = () => navigator.clipboard.writeText(u.uid).then(() => toast("Copied"));
}

function adminView() {
  $("#app").innerHTML = `
    <div class="card">
      <div>Bar: <b>${esc(barId)}</b></div>
      <label style="margin-top:10px"><input type="checkbox" id="appr"> Approve every note before it appears</label>
      <label style="margin-top:10px">Display name <input type="text" id="bname" placeholder="The Snuggest"></label>
      <label style="margin-top:10px">Instagram <input type="text" id="binsta" placeholder="@thesnuggest" style="width:140px"></label>
      <label style="margin-top:10px">Hashtag <input type="text" id="btag" placeholder="#AfterglowRiga" style="width:140px"> <button class="btn" id="bsave">Save</button></label>
      <p class="intro" style="margin:6px 0 0;font-size:12px">Instagram + hashtag are printed on guests' postcards.</p>
    </div>
    <div class="tabs"><button class="btn on" id="secNotes">📝 Notes</button><button class="btn" id="secPaint">🎨 Painting</button></div>
    <div id="notesSec">
      <div class="tabs" id="tabs"></div>
      <div id="stats" class="intro" style="margin:8px 0 0"></div>
      <div id="list"></div>
    </div>
    <div id="paintSec" hidden></div>`;
  $("#secNotes").onclick = () => { $("#secNotes").classList.add("on"); $("#secPaint").classList.remove("on"); $("#notesSec").hidden = false; $("#paintSec").hidden = true; };
  $("#secPaint").onclick = () => { $("#secPaint").classList.add("on"); $("#secNotes").classList.remove("on"); $("#notesSec").hidden = true; $("#paintSec").hidden = false; paintView(); };

  getDoc(doc(db, "bars", barId)).then((s) => {
    bar = s.exists() ? s.data() : {};
    $("#appr").checked = bar.requireApproval === true;
    $("#bname").value = bar.name || "";
    $("#binsta").value = bar.instagram ?? "@thesnuggest";
    $("#btag").value = bar.hashtag ?? "#AfterglowRiga";
  });
  $("#appr").onchange = (e) => setDoc(doc(db, "bars", barId), { requireApproval: e.target.checked }, { merge: true })
    .then(() => toast(e.target.checked ? "Approval mode ON" : "Approval mode OFF"));
  $("#bsave").onclick = () => {
    const ig = $("#binsta").value.trim(), ht = $("#btag").value.trim();
    setDoc(doc(db, "bars", barId), {
      name: $("#bname").value.trim(),
      instagram: ig && !ig.startsWith("@") ? "@" + ig : ig,
      hashtag: ht && !ht.startsWith("#") ? "#" + ht : ht
    }, { merge: true }).then(() => toast("Saved"));
  };

  listenBanned();
  unsub?.();
  unsub = onSnapshot(collection(db, "bars", barId, "notes"), (snap) => {
    notes = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
    renderList();
  }, (e) => toast(e.message));
}

function renderList() {
  const tabs = [
    ["attention", "Needs attention", (n) => n.status === "pending" || (n.reportCount || 0) > 0 && n.status !== "hidden"],
    ["visible", "Visible", (n) => n.status === "visible"],
    ["hidden", "Hidden", (n) => n.status === "hidden"],
    ["all", "All", () => true]
  ];
  const showBlocked = filter === "blocked";
  $("#tabs").innerHTML = "";
  for (const [k, label, fn] of tabs) {
    const b = document.createElement("button");
    b.className = "btn" + (k === filter ? " on" : "");
    b.textContent = `${label} (${notes.filter(fn).length})`;
    b.onclick = () => { filter = k; renderList(); };
    $("#tabs").appendChild(b);
  }
  const tables = new Set(notes.filter((n) => n.status === "visible").map((n) => n.table));
  $("#stats").textContent = `${notes.length} notes total · ${tables.size} tables with visible notes`;

  const bb = document.createElement("button");
  bb.className = "btn" + (showBlocked ? " on" : "");
  bb.textContent = `⛔ Blocked (${banned.size})`;
  bb.onclick = () => { filter = "blocked"; renderList(); };
  $("#tabs").appendChild(bb);
  if (showBlocked) return renderBlocked();

  const fn = tabs.find((x) => x[0] === filter)[2];
  const list = notes.filter(fn);
  $("#list").innerHTML = list.length ? "" : `<p class="intro">Nothing here 🎉</p>`;
  for (const n of list) {
    const el = document.createElement("div");
    el.className = "item";
    const when = n.createdAt ? n.createdAt.toDate().toLocaleString() : "";
    el.innerHTML = `
      <div>${esc(n.mood || "")} ${esc(n.text)} ${n.hasPhoto ? "📷" : ""}</div>
      <div class="meta">Table <b>${esc(n.table)}</b> · ${esc(n.nick || "Anonymous")} · ${esc(when)}
        ${n.status !== "visible" ? `<span class="badge ${esc(n.status)}">${esc(n.status)}</span>` : ""}
        ${n.reportCount ? `<span class="badge rep">⚑ ${n.reportCount}</span>` : ""}</div>
      <div class="actions"></div>`;
    if (n.hasPhoto) {
      const img = document.createElement("img");
      img.style.cssText = "display:block;width:100%;max-width:420px;border-radius:8px;margin:8px 0";
      el.insertBefore(img, el.querySelector(".meta"));
      loadPhoto(n.id).then((src) => { if (src) img.src = src; });
    }
    const acts = el.querySelector(".actions");
    const add = (label, cls, fn) => { const b = document.createElement("button"); b.className = "btn " + cls; b.textContent = label; b.onclick = fn; acts.appendChild(b); };
    const ref = doc(db, "bars", barId, "notes", n.id);
    if (n.status !== "visible") add("✓ Show", "", () => updateDoc(ref, { status: "visible", reportCount: 0 }));
    if (n.status === "visible" && n.reportCount) add("✓ Keep (clear reports)", "", () => updateDoc(ref, { reportCount: 0 }));
    if (n.status !== "hidden") add("Hide", "", () => updateDoc(ref, { status: "hidden" }));
    if (n.uid && !banned.has(n.uid)) add("⛔ Block device", "danger", () => blockDevice(n.uid, n.text || "(photo)"));
    add("Delete", "danger", async () => {
      if (!confirm("Delete this note forever?")) return;
      if (n.hasPhoto) await deleteDoc(doc(db, "bars", barId, "photos", n.id)).catch(() => {});
      await deleteDoc(ref);
    });
    $("#list").appendChild(el);
  }
}

// ---- Living Painting (rounds) ----
let paintUnsub = null, barUnsub = null, cur = 1, target = DEFAULT_TARGET, words = [];
function paintView() {
  $("#paintSec").innerHTML = `
    <div class="card">
      <div>Painting <b id="rn">#…</b> · <span id="pc">…</span></div>
      <label style="margin-top:10px">Words per painting <input type="number" id="tgt" min="20" max="30" style="width:70px"> <button class="btn" id="tsave">Save</button></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn primary" id="pfinish">Finish this painting now</button>
        <a class="btn" href="screen.html?bar=${encodeURIComponent(barId)}" target="_blank">Open bar screen ↗</a>
      </div>
      <p class="intro" style="margin:10px 0 0;font-size:13px">The bar screen closes a painting automatically when it reaches the target, as long as you're signed in on that screen.</p>
    </div>
    <h3 style="font-family:Fraunces,serif;font-weight:500;margin:22px 0 4px">Words in this painting</h3>
    <div id="wlist"></div>
    <h3 style="font-family:Fraunces,serif;font-weight:500;margin:22px 0 4px">Wall gallery posters</h3>
    <div id="wall" class="card"><p class="intro">Loading…</p></div>
    <h3 style="font-family:Fraunces,serif;font-weight:500;margin:22px 0 4px">Finished paintings</h3>
    <div id="plist"><p class="intro">Loading…</p></div>`;
  barUnsub?.();
  barUnsub = onSnapshot(doc(db, "bars", barId), (snap) => {
    const d = snap.exists() ? snap.data() : {};
    target = Math.min(30, Math.max(20, d.roundTarget || DEFAULT_TARGET));
    if ($("#tgt") && document.activeElement !== $("#tgt")) $("#tgt").value = target;
    const n = d.currentRound || 1;
    if (n !== cur || !paintUnsub) { cur = n; listenWords(); loadRounds(); }
    $("#rn").textContent = `#${cur}`;
  });
  $("#tsave").onclick = () => {
    const v = Math.min(30, Math.max(20, parseInt($("#tgt").value, 10) || DEFAULT_TARGET));
    setDoc(doc(db, "bars", barId), { roundTarget: v }, { merge: true }).then(() => toast(`Target: ${v} words`));
  };
  $("#pfinish").onclick = async () => {
    if (!words.length) return toast("No words yet");
    if (!confirm(`Finish painting #${cur} with ${words.length} words and generate the image?`)) return;
    toast("Generating… this can take up to a minute");
    try { await finishRound(db, fsmod, barId, cur, words); toast("Done"); loadRounds(); }
    catch (e) { toast(e.message === "already-finished" ? "Already finished by the screen" : e.message); }
  };
}

function listenWords() {
  paintUnsub?.();
  paintUnsub = onSnapshot(collection(db, "bars", barId, "rounds", roundKey(cur), "strokes"), (snap) => {
    words = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
    $("#pc").textContent = `${words.length} / ${target} words`;
    const wl = $("#wlist"); wl.innerHTML = words.length ? "" : `<p class="intro">No words yet.</p>`;
    for (const w of [...words].reverse()) {
      const el = document.createElement("div"); el.className = "item";
      el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span>${esc(MOODS[w.color]?.emoji || "")} <b>${esc(w.word)}</b> <span style="color:#7a5e52;font-size:12px">${w.table ? "table " + esc(w.table) + " · " : ""}${w.createdAt ? esc(w.createdAt.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })) : ""}</span></span>
        <span style="display:flex;gap:6px"><button class="btn danger" style="color:#c0392b;border-color:#e5a39b;padding:5px 10px;font-size:12px">Remove</button>
        ${w.uid && !banned.has(w.uid) ? `<button class="btn danger blk" style="color:#c0392b;border-color:#e5a39b;padding:5px 10px;font-size:12px">⛔ Block</button>` : ""}</span></div>`;
      el.querySelector("button").onclick = () => deleteDoc(doc(db, "bars", barId, "rounds", roundKey(cur), "strokes", w.id));
      el.querySelector(".blk")?.addEventListener("click", () => blockDevice(w.uid, w.word));
      wl.appendChild(el);
    }
  });
}

// 30 items per poster, in time order (same rule as gallery.html)
function renderWall(doneRounds) {
  const el = $("#wall"); if (!el) return;
  const photos = notes.filter((n) => n.status === "visible" && n.hasPhoto).length;
  const total = doneRounds + photos, PER = 30, MAX = 6;
  const used = Math.max(1, Math.ceil(total / PER));
  let html = `<div class="intro" style="margin:0 0 10px">${total} pictures on the wall (${doneRounds} paintings, ${photos} photos)</div>`;
  for (let k = 1; k <= Math.min(MAX, used + 1); k++) {
    const fill = Math.max(0, Math.min(PER, total - (k - 1) * PER));
    const state = fill >= PER ? "full" : fill > 0 ? "filling" : "next";
    const warn = state === "filling" && fill >= 25 ? ` <b style="color:#ffb36b">· print N° ${k + 1} soon</b>` : "";
    html += `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <b style="width:52px">N° ${k}</b>
      <div style="flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,0.1);overflow:hidden"><i style="display:block;height:100%;width:${(fill / PER) * 100}%;background:linear-gradient(90deg,#ffb36b,#ff6f8e)"></i></div>
      <span style="width:120px;font-size:13px">${fill}/${PER} ${state === "next" ? "· next" : ""}${warn}</span>
      <a class="btn" style="padding:5px 10px;font-size:12px" href="assets/posters/afterglow-poster-${k}.pdf" download>PDF</a></div>`;
  }
  if (total > MAX * PER) html += `<p class="intro" style="color:#ffb36b">More than ${MAX * PER} pictures — ask for posters N° 7+ (newer pictures show in the browse gallery meanwhile).</p>`;
  el.innerHTML = html;
}

async function loadRounds() {
  const pl = $("#plist"); if (!pl) return;
  const snap = await getDocs(collection(db, "bars", barId, "rounds"));
  const items = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => r.status)
    .sort((a, b) => (b.n || 0) - (a.n || 0));
  renderWall(items.filter((r) => r.status === "done").length);
  pl.innerHTML = items.length ? "" : `<p class="intro">None yet.</p>`;
  for (const r of items) {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<img style="display:block;width:100%;border-radius:6px;background:#e9d6c3;min-height:80px">
      <div class="meta">#${r.n} · ${r.count || 0} words · ${esc(r.status)}${r.source === "abstract" ? " · AI failed, abstract version used" : ""}</div>
      <div style="font-size:13px;margin-bottom:8px">${esc((r.words || []).map((w) => w.w).join(" · "))}</div>
      <div class="actions"></div>`;
    const acts = el.querySelector(".actions");
    getDoc(doc(db, "bars", barId, "roundImages", r.id)).then((s) => {
      if (!s.exists()) return;
      const src = s.data().data;
      el.querySelector("img").src = src;
      const a = document.createElement("a"); a.className = "btn"; a.textContent = "⬇ Download";
      a.download = `afterglow-${barId}-${r.id}.jpg`; a.href = src; acts.prepend(a);
    });
    const re = document.createElement("button"); re.className = "btn"; re.textContent = "↻ Regenerate";
    re.onclick = async () => {
      if (!confirm("Generate a new image for this painting? Guests' postcards will show the new one.")) return;
      re.disabled = true; toast("Generating…");
      const strokes = (r.words || []).map((w, i) => ({ id: String(i), word: w.w, color: w.c, table: w.t }));
      try { await regenerate(db, fsmod, barId, r.n, strokes, r.prompt); toast("Done"); loadRounds(); }
      catch (e) { toast(e.message); re.disabled = false; }
    };
    acts.appendChild(re);
    pl.appendChild(el);
  }
}

// ---- blocked devices ----
const banned = new Map(); // uid -> data
let bannedUnsub = null;
function listenBanned() {
  bannedUnsub?.();
  bannedUnsub = onSnapshot(collection(db, "bars", barId, "banned"), (snap) => {
    banned.clear();
    snap.docs.forEach((d) => banned.set(d.id, d.data()));
    if ($("#list")) renderList();
  });
}
async function blockDevice(uid, sample) {
  const mine = notes.filter((n) => n.uid === uid && n.status !== "hidden");
  const words = (typeof tonightWords === "function" ? tonightWords() : []).filter((w) => w.uid === uid);
  if (!confirm(`Block this device?\n\nIt can no longer post notes, photos, words or reports.\nAlso hides its ${mine.length} note(s) and removes its ${words.length} word(s) from the current painting.`)) return;
  await setDoc(doc(db, "bars", barId, "banned", uid), { at: serverTimestamp(), sample: String(sample || "").slice(0, 80) });
  await Promise.all([
    ...mine.map((n) => updateDoc(doc(db, "bars", barId, "notes", n.id), { status: "hidden" })),
    ...words.map((w) => deleteDoc(doc(db, "bars", barId, "rounds", roundKey(cur), "strokes", w.id)))
  ]).catch((e) => toast(e.message));
  toast("Device blocked");
}
function renderBlocked() {
  const list = [...banned.entries()];
  $("#list").innerHTML = list.length ? "" : `<p class="intro">No blocked devices.</p>`;
  for (const [uid, b] of list) {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<div><b>Device</b> <code style="color:#7a5e52;background:#efe2d4">${esc(uid.slice(0, 8))}…</code></div>
      <div class="meta">${b.at ? esc(b.at.toDate().toLocaleString()) : ""}${b.sample ? " · “" + esc(b.sample) + "”" : ""}</div>
      <div class="actions"><button class="btn">Unblock</button></div>`;
    el.querySelector("button").onclick = () => { if (confirm("Unblock this device?")) deleteDoc(doc(db, "bars", barId, "banned", uid)); };
    $("#list").appendChild(el);
  }
}
const tonightWords = () => words;

const photoCache = new Map();
function loadPhoto(id) {
  if (!photoCache.has(id)) photoCache.set(id, getDoc(doc(db, "bars", barId, "photos", id)).then((s) => s.exists() ? s.data().data : null).catch(() => null));
  return photoCache.get(id);
}

$("#out").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (u) => {
  unsub?.(); unsub = null;
  $("#out").hidden = !u || u.isAnonymous;
  if (!u || u.isAnonymous) return signInView();
  try {
    const s = await getDoc(doc(db, "admins", u.uid));
    s.exists() ? adminView() : notAdminView(u);
  } catch (e) { notAdminView(u); }
});
</script>
</body>
</html>
