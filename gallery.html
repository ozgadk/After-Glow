<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a10">
  <title>Afterglow · Wall Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hero { margin: 30px 0 18px; }
    .hero h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: 36px; line-height: 1.1; margin: 0 0 8px; }
    .hero p { color: var(--muted); margin: 0; line-height: 1.5; }
    .choices { display: grid; gap: 10px; margin: 22px 0 30px; }
    .choices .send { width: 100%; }
    .ghost { width: 100%; background: transparent; color: #f6e9e2; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; padding: 13px; font-size: 16px; cursor: pointer; }
    .grid { display: grid; gap: 18px; }
    .art { background: var(--paper); color: var(--ink); padding: 10px 10px 12px; border-radius: 4px 4px 4px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    .art img { display: block; width: 100%; border-radius: 2px; }
    .art .cap { font-family: "Caveat", cursive; font-size: 20px; line-height: 1.2; margin-top: 8px; }
    .art .meta { font-size: 12px; color: #8a6d60; margin-top: 4px; }
    .art:nth-child(odd) { transform: rotate(-0.8deg); } .art:nth-child(even) { transform: rotate(0.7deg); }
    /* AR */
    #ar { position: fixed; inset: 0; z-index: 20; background: #000; display: none; }
    #ar.on { display: block; }
    #ar a-scene { position: absolute; inset: 0; }
    .arbar { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: none; justify-content: space-between; align-items: center; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); }
    .arbar.on { display: flex; }
    .arbar .hint { color: #fff; font-family: "Caveat", cursive; font-size: 22px; text-shadow: 0 0 10px #000; }
    .arbar button { background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
    .strip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: none; gap: 10px; overflow-x: auto; padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,0.65)); }
    .strip.on { display: flex; }
    .strip img { height: 64px; border: 3px solid var(--paper); border-radius: 3px; flex: none; }
    .view { position: fixed; inset: 0; z-index: 50; background: rgba(13,7,12,0.94); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
    .view.on { display: flex; }
    .view img { max-width: 100%; max-height: 70vh; border: 10px solid var(--paper); }
    .view p { font-family: "Caveat", cursive; font-size: 22px; color: #fff3e0; text-align: center; max-width: 520px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="logo">Afterglow</div><div class="langs" id="langs"></div></header>
    <section class="hero"><h1 id="h1"></h1><p id="hp"></p></section>
    <div class="choices">
      <button class="send" id="startAR"></button>
      <button class="ghost" id="browse"></button>
    </div>
    <section class="grid" id="grid"></section>
    <p class="privacy" id="note"></p>
  </div>

  <div id="ar"></div>
  <div class="arbar" id="arbar"><span class="hint" id="arhint"></span><button id="arclose">✕</button></div>
  <div class="strip" id="strip"></div>
  <div class="view" id="view"><img id="vimg" alt=""><p id="vcap"></p></div>
  <div class="toast" id="toast"></div>

<script type="module">
import { firebaseConfig, DEFAULT_BAR, SDK } from "./js/firebase-config.js";
import { LANGS, pickLang, saveLang } from "./js/i18n.js";
const { initializeApp } = await import(`${SDK}/firebase-app.js`);
const { getFirestore, collection, doc, getDoc, getDocs, query, where } = await import(`${SDK}/firebase-firestore.js`);

const db = getFirestore(initializeApp(firebaseConfig));
const barId = (new URLSearchParams(location.search).get("bar") || DEFAULT_BAR).toLowerCase().replace(/[^a-z0-9-]/g, "");
const $ = (id) => document.getElementById(id);

const T = {
  en: { lost: "Poster out of view — point back at it, or tap a picture below", h1: "The wall remembers.", hp: "Paintings made together by strangers and photos left at the tables.", ar: "📷 Point at the poster (AR)", browse: "Just browse the gallery", hint: "Point at the Afterglow poster", empty: "The wall is still empty. Leave a word or a photo tonight ✦", note: "The camera is only used on your phone to find the poster. Nothing is recorded or uploaded.", painted: "Painted together by {n} strangers", arfail: "AR couldn't start here. You can still browse the gallery." },
  lv: { lost: "Plakāts nav redzams — pavērs kameru atpakaļ vai pieskaries attēlam zemāk", h1: "Siena atceras.", hp: "Svešinieku kopā radītas gleznas un pie galdiem atstāti foto.", ar: "📷 Pavērs kameru pret plakātu (AR)", browse: "Vienkārši apskatīt galeriju", hint: "Pavērs kameru pret Afterglow plakātu", empty: "Siena vēl ir tukša. Atstāj šovakar vārdu vai foto ✦", note: "Kamera tiek izmantota tikai tavā telefonā, lai atrastu plakātu. Nekas netiek ierakstīts vai augšupielādēts.", painted: "Kopā uzgleznojuši {n} svešinieki", arfail: "AR šeit neizdevās palaist. Galeriju vari apskatīt arī tāpat." },
  ru: { lost: "Постер вне кадра — наведи камеру снова или нажми на картинку внизу", h1: "Стена помнит.", hp: "Картины, нарисованные незнакомцами вместе, и фото, оставленные за столиками.", ar: "📷 Наведи камеру на постер (AR)", browse: "Просто посмотреть галерею", hint: "Наведи камеру на постер Afterglow", empty: "Стена пока пуста. Оставь сегодня слово или фото ✦", note: "Камера используется только на твоём телефоне, чтобы найти постер. Ничего не записывается и не загружается.", painted: "Нарисовано вместе: {n} незнакомцев", arfail: "AR здесь не запустился. Галерею можно посмотреть и так." },
  tr: { lost: "Poster kadrajda değil — kamerayı tekrar posteri tut ya da aşağıdan bir resme dokun", h1: "Duvar hatırlıyor.", hp: "Yabancıların birlikte yaptığı tablolar ve masalara bırakılan fotoğraflar.", ar: "📷 Kamerayı postere tut (AR)", browse: "Sadece galeriye bak", hint: "Kamerayı Afterglow posterine tut", empty: "Duvar henüz boş. Bu gece bir kelime ya da fotoğraf bırak ✦", note: "Kamera sadece posteri bulmak için telefonunda kullanılır. Hiçbir şey kaydedilmez ya da yüklenmez.", painted: "{n} yabancı birlikte boyadı", arfail: "AR burada başlatılamadı. Galeriye yine de bakabilirsin." }
};
let lang = pickLang();
const t = (k, v = {}) => (T[lang][k] || T.en[k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
function applyLang() {
  document.documentElement.lang = lang;
  $("h1").textContent = t("h1"); $("hp").textContent = t("hp");
  $("startAR").textContent = t("ar"); $("browse").textContent = t("browse");
  $("arhint").textContent = t("hint"); $("note").textContent = t("note");
  const el = $("langs"); el.innerHTML = "";
  for (const l of LANGS) { const b = document.createElement("button"); b.textContent = l; if (l === lang) b.className = "on"; b.onclick = () => { lang = l; saveLang(l); applyLang(); renderGrid(); }; el.appendChild(b); }
}
function toast(m) { const e = $("toast"); e.textContent = m; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 3500); }

// ---- content ----
// Every finished painting and approved photo gets a permanent place in time order:
// items 1–30 → poster N° 1, 31–60 → N° 2, … (posters available: MAX_POSTERS).
const PER_POSTER = 30, MAX_POSTERS = 6;
let items = []; // oldest → newest, metadata only; images load on demand

async function loadItems() {
  const out = [];
  try {
    const rs = await getDocs(collection(db, "bars", barId, "rounds"));
    rs.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => r.status === "done").forEach((r) =>
      out.push({ kind: "painting", key: "r:" + r.id, ref: ["roundImages", r.id], n: r.count || 0, words: (r.words || []).map((w) => w.w), ts: r.closedAt?.toMillis?.() || r.n || 0 }));
  } catch (e) { console.warn(e); }
  try {
    const ns = await getDocs(query(collection(db, "bars", barId, "notes"), where("status", "==", "visible"), where("hasPhoto", "==", true)));
    ns.docs.map((d) => ({ id: d.id, ...d.data() })).forEach((n) =>
      out.push({ kind: "photo", key: "p:" + n.id, ref: ["photos", n.id], text: n.text || "", who: n.nick || "", table: n.table, ts: n.createdAt?.toMillis?.() || 0 }));
  } catch (e) { console.warn(e); }
  items = out.sort((a, b) => a.ts - b.ts || a.key.localeCompare(b.key));
  items.forEach((it, i) => { it.poster = Math.floor(i / PER_POSTER); });
}

const srcCache = new Map();
function loadSrc(it) {
  if (!srcCache.has(it.key)) {
    srcCache.set(it.key, getDoc(doc(db, "bars", barId, ...it.ref)).then((s) => (s.exists() ? s.data().data : null)).catch(() => null));
  }
  return srcCache.get(it.key);
}
async function loadAll(list, n = 4) {
  const q = [...list];
  await Promise.all(Array.from({ length: n }, async () => { while (q.length) { const it = q.shift(); it.src = await loadSrc(it); } }));
}

const captionOf = (it) => it.kind === "painting"
  ? `${t("painted", { n: it.n })} · ${it.words.slice(0, 8).join(" · ")}${it.words.length > 8 ? "…" : ""}`
  : `${it.text}${it.who ? " — " + it.who : ""}`;

// ---- browse view (newest first, images load as you scroll) ----
let io = null;
function renderGrid() {
  const g = $("grid"); g.innerHTML = "";
  if (!items.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = t("empty"); g.appendChild(p); return; }
  io?.disconnect();
  io = new IntersectionObserver((es) => es.forEach(async (e) => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const it = e.target._it; it.src = it.src || await loadSrc(it);
    if (it.src) e.target.querySelector("img").src = it.src;
  }), { rootMargin: "600px" });
  for (const it of [...items].reverse()) {
    const a = document.createElement("article"); a.className = "art";
    a.innerHTML = `<img alt="" style="min-height:120px;background:#e9d6c3"><div class="cap"></div><div class="meta"></div>`;
    a.querySelector(".cap").textContent = captionOf(it);
    a.querySelector(".meta").textContent = it.poster < MAX_POSTERS ? `Poster N° ${it.poster + 1}` : "";
    a._it = it;
    a.onclick = async () => { it.src = it.src || await loadSrc(it); if (it.src) openView(it); };
    io.observe(a);
    g.appendChild(a);
  }
}
let openedAt = 0;
function openView(it) { $("vimg").src = it.src; $("vcap").textContent = captionOf(it); $("view").classList.add("on"); openedAt = Date.now(); }
// ignore the tail of the same tap that opened the view (pointerup → click)
$("view").onclick = () => { if (Date.now() - openedAt > 450) $("view").classList.remove("on"); };

// ---- AR ----
const addScript = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
let arLoaded = false;

// 30 cells around the poster (poster: width 1, height ≈1.414, centred at 0,0), nearest first
const CELL = 0.4;
const SLOTS = (() => {
  const c = [];
  for (let r = -5; r <= 5; r++) for (let q = -4; q <= 4; q++) {
    const x = q * CELL, y = r * CELL;
    if (Math.abs(x) < 0.72 && Math.abs(y) < 0.92) continue; // poster area
    c.push([x, y, Math.hypot(x * 0.9, y * 1.1)]);
  }
  return c.sort((a, b) => a[2] - b[2]).slice(0, PER_POSTER).map(([x, y]) => [x, y]);
})();

// Polaroid texture: picture + handwritten caption
async function polaroid(it, W = 420) {
  await Promise.all([document.fonts.load('500 24px "Caveat"')]).catch(() => {});
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = it.src; });
  const pad = Math.round(W * 0.04), iw = W - pad * 2, fs = Math.round(W * 0.06);
  const ih = it.kind === "painting" ? Math.round(iw * 9 / 16) : Math.round(iw * 0.8);
  const c = document.createElement("canvas"), x = c.getContext("2d");
  x.font = `500 ${fs}px "Caveat", cursive`;
  const lines = []; let line = "";
  for (const word of captionOf(it).split(" ")) {
    const test = line ? line + " " + word : word;
    if (x.measureText(test).width > iw && line) { lines.push(line); line = word; if (lines.length === 2) break; } else line = test;
  }
  if (lines.length < 2 && line) lines.push(line);
  c.width = W; c.height = pad + ih + Math.round(fs * 0.7) + lines.length * Math.round(fs * 1.15) + pad;
  x.fillStyle = "#fff3e0"; x.fillRect(0, 0, c.width, c.height);
  const sc = Math.max(iw / img.width, ih / img.height), sw = iw / sc, sh = ih / sc;
  x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, pad, pad, iw, ih);
  x.fillStyle = "#2a1a14"; x.font = `500 ${fs}px "Caveat", cursive`;
  lines.forEach((l, i) => x.fillText(l, pad, pad + ih + fs * 1.1 + i * fs * 1.15));
  return { canvas: c, aspect: c.height / c.width };
}

const posterCount = () => Math.max(1, Math.min(MAX_POSTERS, Math.ceil(items.length / PER_POSTER)));
let built = new Set(), activePoster = null, tapBound = false;

async function startAR() {
  $("ar").classList.add("on"); $("arbar").classList.add("on");
  try {
    if (!arLoaded) {
      await addScript("https://aframe.io/releases/1.5.0/aframe.min.js");
      await addScript("https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js");
      arLoaded = true;
    }
    buildScene();
  } catch (e) { console.error(e); stopAR(); toast(t("arfail")); }
}

function buildScene() {
  built = new Set(); activePoster = null;
  const n = posterCount();
  let targets = "";
  for (let p = 0; p < n; p++) targets += `<a-entity mindar-image-target="targetIndex: ${p}" id="tg${p}"></a-entity>`;
  $("ar").innerHTML = `
    <a-scene mindar-image="imageTargetSrc: assets/ar/ar-target-${barId}-${n}.mind; maxTrack: 1; uiError: no; uiLoading: yes; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 25; warmupTolerance: 3"
      color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${targets}
    </a-scene>`;
  for (let p = 0; p < n; p++) {
    const tg = $("tg" + p);
    tg.addEventListener("targetFound", () => {
      activePoster = p;
      $("arhint").textContent = `Poster N° ${p + 1}`; $("arhint").style.opacity = 1;
      renderStrip(p);
      fillPoster(p);
    });
    tg.addEventListener("targetLost", () => { if (activePoster === p) { $("arhint").textContent = t("lost"); $("arhint").style.opacity = 1; } });
  }
  document.querySelector("#ar a-scene").addEventListener("arError", () => { stopAR(); toast(t("arfail")); });
  bindTap();
}

async function fillPoster(p) {
  if (built.has(p)) return;
  built.add(p);
  const list = items.filter((it) => it.poster === p);
  await loadAll(list);
  const tg = $("tg" + p);
  if (!tg) return;
  let i = 0;
  for (const it of list) {
    if (!it.src) continue;
    const tex = await polaroid(it);
    const slot = SLOTS[items.indexOf(it) % PER_POSTER];
    const w = it.kind === "painting" ? 0.36 : 0.3, h = w * tex.aspect;
    const ent = document.createElement("a-entity");
    ent.setAttribute("position", `${slot[0]} ${slot[1]} 0`);
    ent.setAttribute("rotation", `0 0 ${((i * 37) % 7) - 3}`);
    ent.setAttribute("scale", "0.001 0.001 0.001");
    ent.setAttribute("animation__in", `property: scale; to: 1 1 1; dur: 500; delay: ${60 * i}; easing: easeOutBack`);
    const plane = document.createElement("a-plane");
    plane.classList.add("clickable");
    plane._it = it;
    plane.setAttribute("width", w); plane.setAttribute("height", h);
    plane.addEventListener("loaded", () => {
      const THREE = AFRAME.THREE;
      const tx = new THREE.CanvasTexture(tex.canvas);
      tx.colorSpace = THREE.SRGBColorSpace;
      plane.getObject3D("mesh").material = new THREE.MeshBasicMaterial({ map: tx });
    });
    ent.appendChild(plane);
    tg.appendChild(ent);
    i++;
  }
}

function renderStrip(p) {
  const st = $("strip"); st.innerHTML = "";
  const list = items.filter((it) => it.poster === p).reverse();
  list.forEach((it) => {
    const im = document.createElement("img");
    im.style.minWidth = "48px"; im.style.background = "#e9d6c3";
    loadSrc(it).then((s) => { if (s) { it.src = s; im.src = s; } });
    im.onclick = () => it.src && openView(it);
    st.appendChild(im);
  });
  st.classList.toggle("on", list.length > 0);
}

// Tap → own raycast (A-Frame's mouse cursor doesn't fire reliably over MindAR's camera view)
function bindTap() {
  if (tapBound) return;
  tapBound = true;
  window.addEventListener("pointerup", (e) => {
    if (!$("ar").classList.contains("on") || $("view").classList.contains("on")) return;
    if (e.target.closest?.(".strip, .arbar")) return;
    const scene = document.querySelector("#ar a-scene");
    const THREE = window.AFRAME?.THREE;
    if (!scene || !THREE || !scene.camera || activePoster === null) return;
    const r = scene.canvas.getBoundingClientRect();
    const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    const ray = new THREE.Raycaster(); ray.setFromCamera(v, scene.camera);
    const planes = [...document.querySelectorAll(`#tg${activePoster} .clickable`)];
    const hit = ray.intersectObjects(planes.map((p) => p.getObject3D("mesh")).filter(Boolean), false)[0];
    const el = hit && planes.find((p) => p.getObject3D("mesh") === hit.object);
    if (el?._it?.src) openView(el._it);
  });
}

function stopAR() {
  const scene = document.querySelector("#ar a-scene");
  try { scene?.systems["mindar-image-system"]?.stop(); } catch {}
  $("ar").innerHTML = ""; $("ar").classList.remove("on"); $("arbar").classList.remove("on"); $("strip").classList.remove("on");
  document.querySelectorAll("video").forEach((v) => { v.srcObject?.getTracks?.().forEach((tr) => tr.stop()); v.remove(); });
}

$("startAR").onclick = startAR;
$("arclose").onclick = stopAR;
$("browse").onclick = () => $("grid").scrollIntoView({ behavior: "smooth" });

applyLang();
await loadItems();
renderGrid();
</script>
</body>
</html>
