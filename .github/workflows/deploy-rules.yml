name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/deploy-rules.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for service account secret
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret not set yet - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy rules
        if: steps.check.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx --yes firebase-tools@latest deploy --only firestore:rules --project after-glow-42465 --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          if [ $code -ne 0 ]; then
            # surface the error as an annotation (visible without opening logs)
            grep -iE "error|denied|permission|not enabled|enable|invalid|failed" "$RUNNER_TEMP/out.txt" | tail -n 8 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit $code
          fi
